# JitPack 构建配置(https://jitpack.io)
# 仓库根无 settings.gradle,Gradle 工程位于 android/logx-aar(单模块 :logx,AGP 8.5.1 + Kotlin 1.9.23)。
# 发布产物:AAR(release 变体,arm64-v8a,MinSizeRel -Oz,含 Kotlin Facade 源码单源编译)。
# 消费坐标以构建完成后 jitpack.io 页面展示的为准(com.github.zzlfeng:LogX:<tag> 或 com.github.zzlfeng.LogX:logx:<tag>)。
#
# 注意:不要用镜像自带的 sdkmanager 显式装组件——它在 JDK 17 下缺 JAXB 必崩(首轮构建实证)。
# 缺失的 platforms/build-tools/NDK 一律交给 AGP 自动下载(compileSdk=34 / ndkVersion=29.0.14206865,
# AGP 8.5 内置组件下载器,依赖镜像预接受的 licenses)。

jdk:
  - openjdk17

install:
  - cd android/logx-aar && ./gradlew :logx:publishToMavenLocal --console=plain --stacktrace --no-daemon
